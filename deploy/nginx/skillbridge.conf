# ==============================================================================
# SkillBridge - Cấu hình Nginx Production Reverse Proxy & Static Hosting
# Domain ví dụ: skillbridge.vn (Frontend) & api.skillbridge.vn (hoặc /api)
# ==============================================================================

# 1. Chuyển hướng toàn bộ HTTP sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name skillbridge.vn www.skillbridge.vn;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Máy chủ HTTPS chính
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skillbridge.vn www.skillbridge.vn;

    # SSL Certificates (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/skillbridge.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skillbridge.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Cấu hình bảo mật HTTP Headers (OWASP)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Giới hạn dung lượng tải lên tối đa (hỗ trợ ảnh thẻ sinh viên và hồ sơ CV)
    client_max_body_size 25M;

    # Gzip nén tài nguyên
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    # --------------------------------------------------------------------------
    # Frontend Single Page Application (React / Vite)
    # --------------------------------------------------------------------------
    location / {
        root /var/www/skillbridge/frontend-user/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Cache các tài nguyên tĩnh đã băm hash (JS, CSS, fonts)
        location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|svg|png|jpg|jpeg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }
    }

    # --------------------------------------------------------------------------
    # Backend API Proxy (.NET Core Kestrel tại 127.0.0.1:5004)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5004/api/;
        proxy_http_version 1.1;

        # Chuyển tiếp headers nhận diện IP thực của client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout cho các tác vụ tải tệp lớn
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Vô hiệu hóa đệm để phản hồi nhanh
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Real-time WebSockets / SignalR Hubs (/hubs)
    # --------------------------------------------------------------------------
    location /hubs/ {
        proxy_pass http://127.0.0.1:5004/hubs/;
        proxy_http_version 1.1;

        # Bắt buộc nâng cấp WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
